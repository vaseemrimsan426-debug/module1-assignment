<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPLORE INDIA WITH US</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link rel="stylesheet" href="styling/styling.css">
</head>


<body>
    <header>
        <div class="container-fluid parent">
            <div class="row child1">
                <div class="col-xl-9 col-lg-6 col-md-8">
                    <div class="container ">
                        <h1>TRAVEL.COM</h1>
                    </div>
                </div>

                <div class="col-xl-3 col-lg-6 col-md-4">
                    <div class="child">
                        <nav class="navbar navbar-expand-lg ">
                            <div class="child3">
                                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                                    aria-label="Toggle navigation center">
                                    <span class="navbar-toggler-icon"></span>
                                </button>
                            </div>
                            <div class="collapse navbar-collapse" id="navbarNav">
                                <ul class="navbar-nav">
                                    <li class="nav-item">
                                        <a class="nav-link" href="index.html">Home</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="destination.html">Destinations</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link" href="feachers.html">Feachers</a>
                                    </li>
                                    <li class="nav-item">
                                        <a class="nav-link active" aria-current="page" href="conatcts.html">Contacts</a>
                                    </li>
                                </ul>
                            </div>
                        </nav>
                    </div>
                    
                </div>
            </div>
        </div>
    </header>

    <main>
        <div class="container py-4">
            <div>
                <h3 class="container about py-4">Please provide your contact info so that we can update you.
                </h3>
            </div>
            <div class="container">
                <form>
                    <div class="container">
                        <div class="row ">
                            <div class="col-12 col-md-12 col-lg-3 col-xl-2 py-2">
                                <label for="name">Name</label>
                                <input type="text" name="fname" id="fname" placeholder="Name" required>
                            </div>

                            <div class="col-12 col-md-12 col-lg-3 col-xl-2 py-2">
                                <label for="email">Email</label>
                                <input type="email" name="Email" placeholder="Email" required>
                            </div>

                            <div class="col-12 col-md-12 col-lg-3 col-xl-2 py-2">
                                <label for="Message">Message</label>
                                <textarea rows="5" name="Message" placeholder="Message" required>
                                </textarea>
                            </div>
                            <div class="col-12 col-md-12 col-lg-3 col-xl-2 py-2">
                                <button type="Submit" class="btn btn-warning">Submit</button>
                            </div>
                            <div class="col-12 col-md-12 col-lg-3 col-xl-2 py-2">
                                <button type="reset" class="btn btn-warning">Reset</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>
        <h6> travel.com | &copy; 2026 </h6>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

</body>

</html>
